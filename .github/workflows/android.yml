name: Android PoC

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Add Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cp app/google-services.json.example app/google-services.json
          fi
      - name: Check and build debug APK
        env:
          FAMILOC_API_BASE_URL: ${{ secrets.FAMILOC_API_BASE_URL }}
          FAMILOC_DEVICE_TOKEN: ${{ secrets.FAMILOC_DEVICE_TOKEN }}
        run: ./gradlew lint test assembleDebug
