name: Android PoC

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Add Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cp app/google-services.json.example app/google-services.json
          fi
      - name: Check and build debug APK
        env:
          FAMILOC_API_BASE_URL: ${{ secrets.FAMILOC_API_BASE_URL }}
          FAMILOC_DEVICE_TOKEN: ${{ secrets.FAMILOC_DEVICE_TOKEN }}
        run: |
          set +e
          ./gradlew lint test assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -80 build.log)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Gradle build failed::$message"
            {
              echo '```text'
              tail -120 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
